# The Last Dance Collectibles admin (Sveltia CMS).
# Open https://legacy7.onrender.com/admin/ and sign in. Saving publishes to the live site in about a minute.
backend:
  name: github
  repo: Hirzo0o/Legacy7
  # Must match the branch Render deploys from.
  branch: production-ready
  commit_messages:
    update: "Admin: update {{collection}} “{{slug}}”"

site_url: https://legacy7.onrender.com
display_url: https://legacy7.onrender.com
media_folder: uploads
public_folder: /uploads

collections:
  - name: store
    label: Store
    files:
      - name: editions
        label: Editions (CR7, Messi, Neymar Jr)
        file: content/editions.json
        fields:
          - name: editions
            label: Editions
            label_singular: Edition
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{title}} — {{status}} — ${{price}}"
            fields:
              - { name: key, label: "Edition code (do not change)", widget: hidden }
              - name: status
                label: Status
                widget: select
                default: active
                options:
                  - { label: "On sale", value: active }
                  - { label: "Sold out (shown, cannot be ordered)", value: sold_out }
                  - { label: "Coming soon (shown, cannot be ordered yet)", value: coming_soon }
                  - { label: "Hidden (removed from the site)", value: hidden }
              - { name: title, label: "Edition name (tabs, bag)", widget: string }
              - { name: tab_name, label: "Short name in the menu (optional, e.g. Raúl)", widget: string, required: false }
              - { name: journey, label: "Edition type", widget: select, default: worldcup, required: false, options: [ { label: "World Cup journey", value: worldcup }, { label: "Career tribute", value: career } ] }
              - { name: product_name, label: "Product name (buy box)", widget: string }
              - { name: price, label: "Price (USD)", widget: number, value_type: float, min: 0 }
              - { name: compare_price, label: "Original price (USD, shown struck through). 0 to hide.", widget: number, value_type: float, min: 0, required: false }
              - { name: player, label: Player name, widget: string }
              - { name: nation, label: Country, widget: string }
              - { name: monogram, label: "Monogram (e.g. CR7)", widget: string }
              - { name: years, label: "Years (e.g. 2006–2026)", widget: string }
              - { name: headline, label: "Headline. Wrap words in *stars* to make them gold.", widget: string }
              - { name: subheadline, label: Text under the headline, widget: text }
              - { name: story, label: Story paragraph, widget: text }
              - { name: quote, label: Quote in the gold foil panel, widget: string }
              - { name: signature, label: Signature text inside the illustrated frame, widget: string }
              - { name: artwork, label: "Full design artwork as one image (fallback, used only when the poster below has no pieces)", widget: image, required: false }
              - name: poster
                label: "Poster pieces (what the frame shows; replace or move any piece)"
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: background, label: "Background (lines, dots and card frames)", widget: image, required: false }
                  - { name: ratio, label: "Height ÷ width (0.625 for a 16×10 poster)", widget: number, value_type: float, min: 0.3, max: 2, step: 0.001, default: 0.625 }
                  - name: layers
                    label: Pieces
                    label_singular: piece
                    widget: list
                    required: false
                    collapsed: true
                    summary: "{{fields.label}}"
                    typeKey: type
                    types:
                      - name: image
                        label: Picture
                        widget: object
                        summary: "{{fields.label}}"
                        fields:
                          - { name: label, label: "Name of this piece", widget: string }
                          - { name: image, label: "Picture (transparent PNG for the player, logo, crest, trophy and signature)", widget: image, required: false }
                          - name: bind
                            label: "Use a picture from elsewhere in this edition"
                            widget: select
                            required: false
                            hint: "Crest and signature use the fields above; Card N uses that card's image in The cards list. Leave empty to use the picture here."
                            options:
                              - { label: "No, use the picture here", value: none }
                              - { label: "Team crest", value: crest }
                              - { label: "Signature image", value: signature }
                              - { label: "Card 1", value: card-0 }
                              - { label: "Card 2", value: card-1 }
                              - { label: "Card 3", value: card-2 }
                              - { label: "Card 4", value: card-3 }
                              - { label: "Card 5", value: card-4 }
                              - { label: "Card 6", value: card-5 }
                          - { name: x, label: "Left (% of the poster width)", widget: number, value_type: float, step: 0.1 }
                          - { name: y, label: "Top (% of the poster height)", widget: number, value_type: float, step: 0.1 }
                          - { name: w, label: "Width (%)", widget: number, value_type: float, step: 0.1 }
                          - { name: h, label: "Height (%)", widget: number, value_type: float, step: 0.1 }
                          - { name: fit, label: "Fit", widget: select, default: contain, options: [ { label: "Fit inside the box", value: contain }, { label: "Fill the box (crop edges)", value: cover } ] }
                          - { name: mono, label: "Black and white with faded bottom (player photo)", widget: boolean, required: false, default: false }
                          - { name: effect, label: "Glow (optional, e.g. drop-shadow(0px 0px 18px rgba(191,149,63,0.35)))", widget: string, required: false }
                          - { name: hidden, label: "Hide this piece", widget: boolean, required: false, default: false }
                      - name: text
                        label: Text
                        widget: object
                        summary: "{{fields.label}}: {{fields.text}}"
                        fields:
                          - { name: label, label: "Name of this piece", widget: string }
                          - { name: text, label: Text, widget: string }
                          - { name: x, label: "Left (% of the poster width)", widget: number, value_type: float, step: 0.1 }
                          - { name: y, label: "Top (% of the poster height)", widget: number, value_type: float, step: 0.1 }
                          - { name: w, label: "Width (%) — text is centred in this box", widget: number, value_type: float, step: 0.1 }
                          - { name: h, label: "Height (%)", widget: number, value_type: float, step: 0.1 }
                          - { name: size, label: "Font size (px on a 1000px-wide poster)", widget: number, value_type: float, step: 0.5 }
                          - { name: font, label: Font, widget: select, default: Montserrat, options: [ Montserrat, Cinzel ] }
                          - { name: weight, label: "Weight (100 thin – 900 black)", widget: number, value_type: int, min: 100, max: 900, step: 100, default: 600 }
                          - { name: italic, label: Italic, widget: boolean, required: false, default: false }
                          - { name: spacing, label: "Letter spacing (px on a 1000px-wide poster)", widget: number, value_type: float, step: 0.1, default: 0 }
                          - { name: gold, label: "Gold foil gradient (ignores the colour below)", widget: boolean, required: false, default: true }
                          - { name: color, label: Colour, widget: color, enableAlpha: true, allowInput: true, required: false }
                          - { name: hidden, label: "Hide this piece", widget: boolean, required: false, default: false }
              - { name: portrait, label: "Player portrait inside the illustrated frame (optional)", widget: image, required: false }
              - { name: crest, label: "Team crest (also shown on the poster)", widget: image, required: false }
              - { name: signature_image, label: "Signature image (also shown on the poster)", widget: image, required: false }
              - name: photos
                label: "Photos of the real frame (if empty, an illustrated frame is shown)"
                label_singular: Photo
                widget: list
                required: false
                field: { name: photo, label: Photo, widget: image }
              - { name: video, label: "Video at the top (MP4, optional)", widget: file, required: false }
              - { name: video_poster, label: "Video cover image (optional)", widget: image, required: false }
              - name: cards
                label: The cards
                label_singular: Card
                widget: list
                summary: "{{year}} — {{tournament}}"
                fields:
                  - { name: year, label: Year, widget: string }
                  - { name: tournament, label: Tournament, widget: string }
                  - { name: shirt, label: "Shirt number (e.g. #7)", widget: string }
                  - { name: label, label: "Short label (e.g. DEBUT)", widget: string }
                  - { name: reached, label: "Stage reached", widget: string }
                  - { name: description, label: Description, widget: text }
                  - { name: image, label: "Card image (the real sticker; also shown on the poster)", widget: image, required: false }
                  - { name: area, label: "Clickable area on the full-design image, only when there are no poster pieces: left,top,width,height in %", widget: string, required: false }
                  - { name: colour, label: Card colour, widget: color, required: false }
                  - { name: accent, label: Accent colour, widget: color, required: false }

      - name: reviews
        label: Customer reviews
        file: content/reviews.json
        fields:
          - name: reviews
            label: Reviews
            label_singular: Review
            widget: list
            summary: "{{author}} ({{stars}}★) — {{edition}}"
            fields:
              - name: edition
                label: Edition
                widget: select
                default: cr7
                options:
                  - { label: CR7, value: cr7 }
                  - { label: Lionel Messi, value: lm10 }
                  - { label: Neymar Jr, value: njr10 }
                  - { label: Zinedine Zidane, value: zz10 }
                  - { label: Diego Maradona, value: dm10 }
                  - { label: Toni Kroos, value: kroos }
                  - { label: Sergio Ramos, value: ramos }
                  - { label: Luka Modrić, value: modric }
                  - { label: Raúl González, value: raul }
                  - { label: Ángel Di María, value: dimaria }
                  - { label: Karim Benzema, value: benzema }
              - { name: stars, label: Stars, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { name: author, label: Name, widget: string }
              - { name: text, label: Review, widget: text }

      - name: settings
        label: Site settings
        file: content/settings.json
        fields:
          - { name: brand_line_1, label: "Logo text, first line", widget: string }
          - { name: brand_line_2, label: "Logo text, second line", widget: string }
          - { name: announcement, label: "Top bar message", widget: string }
          - { name: whatsapp_number, label: "WhatsApp number (digits only, with country code)", widget: string, pattern: ["^[0-9]{8,15}$", "Digits only, including country code"] }
          - { name: phone_display, label: Phone number as shown in the footer, widget: string }
          - { name: favicon, label: "Browser tab icon", widget: image, required: false }

# The Last Dance Collectibles admin (Sveltia CMS).
# Open https://legacy7.onrender.com/admin/ and sign in. Saving publishes to the live site in about a minute.
backend:
  name: github
  repo: Hirzo0o/Legacy7
  # Must match the branch Render deploys from.
  branch: production-ready
  commit_messages:
    update: "Admin: update {{collection}} “{{slug}}”"

site_url: https://legacy7.onrender.com
display_url: https://legacy7.onrender.com
media_folder: uploads
public_folder: /uploads

collections:
  - name: store
    label: Store
    files:
      - name: editions
        label: Editions (CR7, Messi, Neymar Jr)
        file: content/editions.json
        fields:
          - name: editions
            label: Editions
            label_singular: Edition
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{title}} — {{status}} — ${{price}}"
            fields:
              - { name: key, label: "Edition code (do not change)", widget: hidden }
              - name: status
                label: Status
                widget: select
                default: active
                options:
                  - { label: "On sale", value: active }
                  - { label: "Sold out (shown, cannot be ordered)", value: sold_out }
                  - { label: "Hidden (removed from the site)", value: hidden }
              - { name: title, label: "Edition name (tabs, bag)", widget: string }
              - { name: product_name, label: "Product name (buy box)", widget: string }
              - { name: price, label: "Price (USD)", widget: number, value_type: float, min: 0 }
              - { name: compare_price, label: "Original price (USD, shown struck through). 0 to hide.", widget: number, value_type: float, min: 0, required: false }
              - { name: player, label: Player name, widget: string }
              - { name: nation, label: Country, widget: string }
              - { name: monogram, label: "Monogram (e.g. CR7)", widget: string }
              - { name: years, label: "Years (e.g. 2006–2026)", widget: string }
              - { name: headline, label: "Headline. Wrap words in *stars* to make them gold.", widget: string }
              - { name: subheadline, label: Text under the headline, widget: text }
              - { name: story, label: Story paragraph, widget: text }
              - { name: quote, label: Quote in the gold foil panel, widget: string }
              - { name: signature, label: Signature text inside the illustrated frame, widget: string }
              - { name: artwork, label: "Full design artwork (shown as the frame; cards become clickable using each card's area)", widget: image, required: false }
              - { name: portrait, label: "Player portrait inside the illustrated frame (optional)", widget: image, required: false }
              - { name: crest, label: "Team crest in the frame (optional)", widget: image, required: false }
              - { name: signature_image, label: "Signature image in the frame (optional, replaces the signature text)", widget: image, required: false }
              - name: photos
                label: "Photos of the real frame (if empty, an illustrated frame is shown)"
                label_singular: Photo
                widget: list
                required: false
                field: { name: photo, label: Photo, widget: image }
              - { name: video, label: "Video at the top (MP4, optional)", widget: file, required: false }
              - { name: video_poster, label: "Video cover image (optional)", widget: image, required: false }
              - name: cards
                label: The cards
                label_singular: Card
                widget: list
                summary: "{{year}} — {{tournament}}"
                fields:
                  - { name: year, label: Year, widget: string }
                  - { name: tournament, label: Tournament, widget: string }
                  - { name: shirt, label: "Shirt number (e.g. #7)", widget: string }
                  - { name: label, label: "Short label (e.g. DEBUT)", widget: string }
                  - { name: reached, label: "Stage reached", widget: string }
                  - { name: description, label: Description, widget: text }
                  - { name: image, label: "Card image (optional, the real sticker)", widget: image, required: false }
                  - { name: area, label: "Position on the artwork: left,top,width,height in % (e.g. 12.05,50.92,12.5,25.18)", widget: string, required: false }
                  - { name: colour, label: Card colour, widget: color, required: false }
                  - { name: accent, label: Accent colour, widget: color, required: false }

      - name: reviews
        label: Customer reviews
        file: content/reviews.json
        fields:
          - name: reviews
            label: Reviews
            label_singular: Review
            widget: list
            summary: "{{author}} ({{stars}}★) — {{edition}}"
            fields:
              - name: edition
                label: Edition
                widget: select
                default: cr7
                options:
                  - { label: CR7, value: cr7 }
                  - { label: Lionel Messi, value: lm10 }
                  - { label: Neymar Jr, value: njr10 }
              - { name: stars, label: Stars, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { name: author, label: Name, widget: string }
              - { name: text, label: Review, widget: text }

      - name: settings
        label: Site settings
        file: content/settings.json
        fields:
          - { name: brand_line_1, label: "Logo text, first line", widget: string }
          - { name: brand_line_2, label: "Logo text, second line", widget: string }
          - { name: announcement, label: "Top bar message", widget: string }
          - { name: whatsapp_number, label: "WhatsApp number (digits only, with country code)", widget: string, pattern: ["^[0-9]{8,15}$", "Digits only, including country code"] }
          - { name: phone_display, label: Phone number as shown in the footer, widget: string }
          - { name: favicon, label: "Browser tab icon", widget: image, required: false }
